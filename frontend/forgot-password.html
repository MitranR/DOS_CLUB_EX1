<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CityCare Hospital</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">🏥</span>
        <span>CityCare Hospital</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="doctors.html">Doctors</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Back to Login</a>
      </div>
    </div>
  </nav>

  <!-- Forgot & Reset Password Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 50px; height: 50px; font-size: 1.6rem; background: linear-gradient(135deg, var(--warning-amber), var(--primary-blue));">🔑</div>
        <h1>Account Recovery</h1>
        <p>Reset your password to regain access to your CityCare account.</p>
      </div>

      <div id="resetAlert" class="alert"></div>

      <!-- Step 1: Request Token -->
      <form id="requestTokenForm">
        <div class="form-group">
          <label for="identifier">Username or Registered Email</label>
          <input 
            type="text" 
            id="identifier" 
            class="form-control" 
            placeholder="Enter username or email address" 
            required
          >
        </div>

        <button type="submit" id="requestTokenBtn" class="btn btn-primary btn-block">
          Generate Reset Token
        </button>
      </form>

      <!-- Step 2: Enter Token and New Password (Hidden until token requested) -->
      <form id="resetPasswordForm" style="display: none; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
        <div class="form-group">
          <label for="resetToken">Security Reset Token</label>
          <input 
            type="text" 
            id="resetToken" 
            class="form-control" 
            placeholder="Paste your reset token here" 
            required
          >
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input 
            type="password" 
            id="newPassword" 
            class="form-control" 
            placeholder="Minimum 6 characters" 
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input 
            type="password" 
            id="confirmNewPassword" 
            class="form-control" 
            placeholder="Re-enter new password" 
            required
          >
        </div>

        <button type="submit" id="resetPasswordBtn" class="btn btn-green btn-block">
          Update Password & Log In
        </button>
      </form>

      <div class="auth-links">
        Remembered your credentials? 
        <a href="login.html" style="font-weight: 700; color: var(--primary-blue);">Return to Login</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 CityCare Hospital Management System. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script>
    const requestForm = document.getElementById('requestTokenForm');
    const resetForm = document.getElementById('resetPasswordForm');
    const requestBtn = document.getElementById('requestTokenBtn');
    const resetBtn = document.getElementById('resetPasswordBtn');

    // Handle Token Request
    requestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('resetAlert');

      const identifier = document.getElementById('identifier').value.trim();
      if (!identifier) return;

      requestBtn.disabled = true;
      requestBtn.textContent = 'Generating token...';

      try {
        const response = await apiRequest('/auth/forgot-password', {
          method: 'POST',
          body: { identifier }
        });

        showAlert(
          'resetAlert', 
          `Reset token generated for ${response.username}! Enter your new password below.`, 
          true
        );

        // Pre-fill token field and reveal password change section
        document.getElementById('resetToken').value = response.reset_token;
        resetForm.style.display = 'block';
        document.getElementById('newPassword').focus();

      } catch (err) {
        showAlert('resetAlert', err.message);
      } finally {
        requestBtn.disabled = false;
        requestBtn.textContent = 'Generate Reset Token';
      }
    });

    // Handle Password Reset
    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('resetAlert');

      const token = document.getElementById('resetToken').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (newPassword.length < 6) {
        showAlert('resetAlert', 'Password must be at least 6 characters long.');
        return;
      }

      if (newPassword !== confirmNewPassword) {
        showAlert('resetAlert', 'Passwords do not match. Please verify.');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Updating password...';

      try {
        const response = await apiRequest('/auth/reset-password', {
          method: 'POST',
          body: { token, new_password: newPassword }
        });

        showAlert('resetAlert', response.message + ' Redirecting to login...', true);

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);

      } catch (err) {
        showAlert('resetAlert', err.message);
        resetBtn.disabled = false;
        resetBtn.textContent = 'Update Password & Log In';
      }
    });
  </script>
</body>
</html>
